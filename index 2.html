<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slayers 2 Wiki</title>
<meta name="description" content="Fan-made encyclopedia for Slayers 2 on Roblox: breathing styles, blood demon arts, clans, weapons, bosses, locations and guides.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0c0e;--bg2:#141215;--panel:rgba(30,26,30,.62);--line:rgba(200,170,110,.18);--tx:#e7e0d6;--mut:#9a9088;--gold:#c2a265;--red:#8c2230;--red2:#5e1520;--hdr:rgba(13,12,14,.82);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
:root[data-theme=light]{--bg:#f1ebe0;--bg2:#e8e0d1;--panel:rgba(255,252,246,.75);--line:rgba(110,80,30,.22);--tx:#2a2420;--mut:#6d625a;--gold:#8a6b2e;--red:#8c2230;--red2:#6e1824;--hdr:rgba(241,235,224,.88);color-scheme:light}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]):not([data-theme=light]){}}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Zen Kaku Gothic New',system-ui,sans-serif;line-height:1.6;min-height:100%;transition:background .4s,color .4s}
h1,h2,h3,.serif{font-family:'Shippori Mincho',Georgia,serif;font-weight:700;letter-spacing:.02em;margin:0}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#loader{position:fixed;inset:0;z-index:100;background:#0d0c0e;display:grid;place-items:center;transition:opacity .7s,visibility .7s}
#loader.off{opacity:0;visibility:hidden}#loader div{font-family:'Shippori Mincho',serif;color:#c2a265;font-size:2.4rem;letter-spacing:.3em;animation:br 1.6s ease-in-out infinite}
@keyframes br{50%{opacity:.35}}
header{position:fixed;top:0;left:0;right:0;z-index:40;padding-top:env(safe-area-inset-top,0px);background:var(--hdr);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;height:62px;padding:0 14px;max-width:1500px;margin:auto}
.logo{font-family:'Shippori Mincho',serif;font-weight:800;font-size:1.15rem;white-space:nowrap;display:flex;gap:8px;align-items:center}.logo b{color:var(--gold);font-size:1.5rem}
.ib{background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;transition:.25s;flex:none}.ib:hover{border-color:var(--gold);color:var(--gold)}
.sw{position:relative;flex:1;max-width:520px;margin-left:auto}
.sw input{width:100%;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);padding:0 12px}
#sug{position:absolute;top:44px;left:0;right:0;background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:none;box-shadow:0 14px 40px rgba(0,0,0,.45)}
#sug a{display:flex;justify-content:space-between;padding:9px 12px;font-size:.92rem}#sug a:hover,#sug a.on{background:var(--red2);color:#fff}#sug small{color:var(--mut)}
aside{position:fixed;top:calc(62px + env(safe-area-inset-top,0px));bottom:0;left:0;width:250px;overflow:auto;padding:16px 12px 40px;border-right:1px solid var(--line);background:var(--bg2);z-index:30;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
aside a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;color:var(--mut);font-size:.95rem;transition:.2s}
aside a i{font-style:normal;font-family:'Shippori Mincho',serif;width:22px;text-align:center;color:var(--gold)}aside a:hover{color:var(--tx);background:var(--panel)}aside a.on{color:var(--tx);background:var(--red2);box-shadow:inset 2px 0 var(--gold)}
aside h4{margin:18px 10px 6px;font-size:.78rem;color:var(--mut);font-weight:500}
main{margin-left:250px;padding:calc(62px + env(safe-area-inset-top,0px)) 0 60px;min-height:100vh;animation:pg .5s ease}
@keyframes pg{from{opacity:0;transform:translateY(8px)}}
.wrap{max-width:1100px;margin:auto;padding:28px 22px}
@media(max-width:860px){aside{transform:translateX(-102%);width:80%;max-width:300px}body.menu aside{transform:none}main{margin-left:0}.logo span{display:none}}
.hero{position:relative;min-height:78vh;display:grid;align-items:center;overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(ellipse at 70% 25%,#3a1a1f 0,#1a0f13 40%,#0d0c0e 80%)}
.moon{position:absolute;right:14%;top:12%;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#e9dcc0,#b99a62 70%);opacity:.88;box-shadow:0 0 80px rgba(194,162,101,.18)}
.hero svg{position:absolute;left:0;bottom:-2px;width:100%;height:60%}.hero .in{position:relative;z-index:2;padding:40px 22px;max-width:1100px;margin:auto;width:100%}
.hero h1{font-size:clamp(2.6rem,8vw,5.6rem);line-height:1.02;color:#efe6d4;max-width:760px}.hero p{max-width:520px;color:#c4b9aa;font-size:1.05rem;margin:18px 0 26px}
.bt{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:8px;border:1px solid var(--gold);background:linear-gradient(180deg,var(--red),var(--red2));color:#f3eadb;transition:transform .25s,box-shadow .25s;margin:0 8px 8px 0}
.bt:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.4)}.bt.g{background:transparent;color:#e7dcc6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{display:block;position:relative;padding:18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(8px);transition:transform .3s,border-color .3s,box-shadow .3s}
.card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 14px 30px rgba(0,0,0,.3)}.card h3{font-size:1.1rem;margin:6px 0 4px}.card p{margin:0;color:var(--mut);font-size:.88rem}
.k{font-family:'Shippori Mincho',serif;font-size:2rem;color:var(--gold);line-height:1}
.sec{margin:42px 0 14px;display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:8px}.sec h2{font-size:1.5rem}
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}
.badge{display:inline-block;font-size:.74rem;padding:1px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut);margin:0 5px 5px 0;background:none}
.badge.Legendary,.badge.Mythic{color:var(--gold);border-color:var(--gold)}.badge.Epic{color:#b9707f;border-color:#8c2230}.badge.Rare{color:#8fa0b0}
button.badge:hover{color:var(--gold);border-color:var(--gold)}
.crumb{font-size:.85rem;color:var(--mut);margin-bottom:14px}.crumb a:hover{color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}select,.fi{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);padding:0 10px}
.ent{display:grid;grid-template-columns:260px 1fr;gap:24px}@media(max-width:760px){.ent{grid-template-columns:1fr}}
.img{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:linear-gradient(145deg,var(--red2),#15101a);display:grid;place-items:center;overflow:hidden}.img img{width:100%;height:100%;object-fit:cover;animation:pg .8s}.img .k{font-size:5rem;opacity:.6}
table{width:100%;border-collapse:collapse}td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}td:first-child{width:34%;color:var(--gold);font-size:.9rem}.un{color:var(--mut);font-style:italic}
textarea.fi{width:100%;height:auto;min-height:60px;padding:8px;resize:vertical}label{display:block;font-size:.82rem;color:var(--gold);margin:12px 0 4px}
#top{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));opacity:0;pointer-events:none;transition:.3s;z-index:35;background:var(--red2);color:#fff;border-color:var(--gold)}#top.on{opacity:1;pointer-events:auto}
.empty{padding:34px;border:1px dashed var(--line);border-radius:12px;color:var(--mut);text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
</style></head><body>
<div id="loader"><div>鬼滅</div></div>
<header><div class="bar">
<button class="ib" id="mb" aria-label="Menu">☰</button>
<a href="#home" class="logo"><b>斬</b><span>SLAYERS 2 WIKI</span></a>
<div class="sw"><input id="q" placeholder="Search entries, clans, tags…" autocomplete="off" aria-label="Search"><div id="sug"></div></div>
<button class="ib" id="th" aria-label="Toggle theme">◐</button></div></header>
<aside id="side"></aside><main id="app"></main>
<button class="ib" id="top" aria-label="Back to top">↑</button>
<script>
const CATS=[
["breathing","Breathing Styles","呼","All breathing styles and their techniques.","Description|Skills|Damage|Cooldown|Animation|How to obtain|Combos"],
["bda","Blood Demon Arts","血","Demon arts and how to unlock them.","Description|Skills|Damage|Cooldown|Animation|How to obtain|Combos"],
["clans","Clans","族","Clans, spawn chances and bonuses.","Description|Bonuses|How to obtain|Notes"],
["weapons","Weapons","刀","Swords and other weapons.","Stats|How to obtain|Requirements|Traits|Pros|Cons"],
["bosses","Bosses","鬼","Boss encounters, drops and strategies.","Description|Location|Drops|Strategy"],
["npcs","NPCs","人","Characters and where to find them.","Description|Location|Role|Rewards"],
["locations","Locations","地","Areas of the game world.","Description|Access|Points of interest|Enemies"],
["items","Items","物","Consumables, materials and gear.","Description|How to obtain|Uses"],
["quests","Quests","巻","Quests and their rewards.","Description|Giver|Steps|Rewards"],
["races","Races","種","Playable races and traits.","Description|Traits|How to obtain"],
["skills","Skills","技","Abilities and passives.","Description|Damage|Cooldown|Animation|How to obtain|Combos"],
["progression","Progression","進","Leveling and character growth.","Description|Requirements|Tips"],
["guides","Guides","導","Player guides and walkthroughs.","Summary|Steps|Tips"]
].map(([id,name,k,desc,f])=>({id,name,k,desc,f:f.split("|")}));
const RAR=["Unknown","Common","Uncommon","Rare","Epic","Legendary","Mythic"];
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert("Storage full or blocked: changes will not persist.")}};
const uid=()=>"e-"+Math.random().toString(36).slice(2,8);
const DISCORD="";
const SEED={"e":{"e-brea1":{"id":"e-brea1","cat":"breathing","name":"Breathing Style Template 1","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}},"e-brea2":{"id":"e-brea2","cat":"breathing","name":"Breathing Style Template 2","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}},"e-bda1":{"id":"e-bda1","cat":"bda","name":"Blood Demon Art Template 1","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}},"e-bda2":{"id":"e-bda2","cat":"bda","name":"Blood Demon Art Template 2","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}},"e-clan1":{"id":"e-clan1","cat":"clans","name":"Clan Template 1","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}},"e-clan2":{"id":"e-clan2","cat":"clans","name":"Clan Template 2","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}},"e-weap1":{"id":"e-weap1","cat":"weapons","name":"Weapon Template 1","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}},"e-weap2":{"id":"e-weap2","cat":"weapons","name":"Weapon Template 2","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}},"e-boss1":{"id":"e-boss1","cat":"bosses","name":"Bosse Template 1","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}},"e-boss2":{"id":"e-boss2","cat":"bosses","name":"Bosse Template 2","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}},"e-npcs1":{"id":"e-npcs1","cat":"npcs","name":"NPC Template 1","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}},"e-npcs2":{"id":"e-npcs2","cat":"npcs","name":"NPC Template 2","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}},"e-loca1":{"id":"e-loca1","cat":"locations","name":"Location Template 1","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}},"e-loca2":{"id":"e-loca2","cat":"locations","name":"Location Template 2","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}},"e-item1":{"id":"e-item1","cat":"items","name":"Item Template 1","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}},"e-item2":{"id":"e-item2","cat":"items","name":"Item Template 2","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}},"e-ques1":{"id":"e-ques1","cat":"quests","name":"Quest Template 1","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}},"e-ques2":{"id":"e-ques2","cat":"quests","name":"Quest Template 2","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}},"e-race1":{"id":"e-race1","cat":"races","name":"Race Template 1","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}},"e-race2":{"id":"e-race2","cat":"races","name":"Race Template 2","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}},"e-skil1":{"id":"e-skil1","cat":"skills","name":"Skill Template 1","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}},"e-skil2":{"id":"e-skil2","cat":"skills","name":"Skill Template 2","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}},"e-prog1":{"id":"e-prog1","cat":"progression","name":"Progression Template 1","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}},"e-prog2":{"id":"e-prog2","cat":"progression","name":"Progression Template 2","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}},"e-guid1":{"id":"e-guid1","cat":"guides","name":"Guide Template 1","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}},"e-guid2":{"id":"e-guid2","cat":"guides","name":"Guide Template 2","rarity":"Unknown","type":"Unknown","tags":["template"],"img":"","f":{}}},"log":[{"id":"l1","v":"Version Unknown","d":"Date Unknown","t":"Template entry. Add real patch notes in Edit mode."}]};
let DB=ld("s2db",null)||JSON.parse(JSON.stringify(SEED)),CAN=ld("s2edit",false),LOADED=true;
function push(){sv("s2db",DB)}
let FAV=ld("s2fav",[]),REC=ld("s2rec",[]);
const cat=id=>CATS.find(c=>c.id===id),ents=()=>Object.values(DB.e);
const val=v=>v&&v.trim()?esc(v).replace(/\n/g,"<br>"):'<span class="un">Unknown</span>';
const bd=(t,r)=>`<span class="badge ${esc(r||"")}">${esc(t)}</span>`;
const card=e=>`<a class="card rv" href="#${e.id}"><div class="k">${cat(e.cat).k}</div><h3>${esc(e.name)}</h3><p>${esc(cat(e.cat).name)} · ${esc(e.type)}</p><div style="margin-top:10px">${bd(e.rarity,e.rarity)}${(e.tags||[]).slice(0,2).map(t=>bd("#"+t)).join("")}</div></a>`;
function side(r){$("#side").innerHTML=`<a href="#home" class="${r==="home"?"on":""}"><i>家</i>Home</a><h4>Categories</h4>`+CATS.map(c=>`<a href="#c-${c.id}" class="${r==="c-"+c.id?"on":""}"><i>${c.k}</i>${c.name}</a>`).join("")+`<h4>Library</h4><a href="#favs" class="${r==="favs"?"on":""}"><i>★</i>Favorites (${FAV.length})</a><a href="#changelog" class="${r==="changelog"?"on":""}"><i>歴</i>Changelog</a><h4>Editor</h4><a href="#" id="em"><i>✎</i>Edit mode: ${CAN?"on":"off"}</a>${CAN?`<a href="#" id="ex"><i>⇩</i>Export data</a><a href="#" id="rs"><i>↺</i>Reset local edits</a>`:""}<h4>Recently viewed</h4>`+(REC.length?REC.filter(i=>DB.e[i]).map(i=>`<a href="#${i}"><i>·</i>${esc(DB.e[i].name)}</a>`).join(""):'<a style="pointer-events:none"><i>·</i>Nothing yet</a>')}
const R={};
R.home=()=>{const rec=ents().filter(e=>e.cat==="guides").slice(0,3);
return `<section class="hero"><div class="moon" data-p=".15"></div><svg data-p=".08" viewBox="0 0 1200 300" preserveAspectRatio="none"><path d="M0 300V190L140 110 260 200 400 90 540 210 700 70 860 200 1000 120 1200 220V300Z" fill="#1d1216"/><path d="M0 300V240L180 170 330 250 520 160 720 260 920 180 1200 260V300Z" fill="#120d10"/></svg>
<div class="in"><h1>SLAYERS 2<br>WIKI</h1><p>A fan-made encyclopedia of the world of Slayers 2: breathing styles, demon arts, clans, weapons, bosses and guides. Unconfirmed data is marked Unknown.</p><a class="bt" href="#c-breathing">Explore Wiki</a><a class="bt g" href="#" id="dc">Discord</a></div></section>
<div class="wrap"><div class="sec rv"><h2>Popular sections</h2></div><div class="grid">${CATS.slice(0,6).map(c=>`<a class="card rv" href="#c-${c.id}"><div class="k">${c.k}</div><h3>${c.name}</h3><p>${c.desc}</p></a>`).join("")}</div>
<div class="sec rv"><h2>Latest updates</h2><a href="#changelog" class="un">All updates</a></div><div class="grid">${DB.log.slice(0,3).map(l=>`<div class="card rv"><h3>${esc(l.v)}</h3><p>${esc(l.d)}</p><p style="margin-top:8px;color:var(--tx)">${esc(l.t)}</p></div>`).join("")}</div>
<div class="sec rv"><h2>Popular guides</h2><a href="#c-guides" class="un">All guides</a></div><div class="grid">${rec.length?rec.map(card).join(""):'<div class="empty">No guides yet.</div>'}</div>
<div class="sec rv"><h2>All categories</h2></div><div class="grid">${CATS.slice(6).map(c=>`<a class="card rv" href="#c-${c.id}"><div class="k">${c.k}</div><h3>${c.name}</h3><p>${c.desc}</p></a>`).join("")}</div></div>`};
R.cat=(id,st)=>{const c=cat(id);let L=ents().filter(e=>e.cat===id);const fr=st.r||"",ft=st.t||"";const types=[...new Set(L.map(e=>e.type))];
if(fr)L=L.filter(e=>e.rarity===fr);if(ft)L=L.filter(e=>e.type===ft);
return `<div class="wrap"><div class="crumb"><a href="#home">Home</a> / ${c.name}</div><div class="k">${c.k}</div><h1 style="font-size:2.4rem">${c.name}</h1><p style="color:var(--mut)">${c.desc}</p>
<div class="row"><select id="fr" aria-label="Rarity"><option value="">All rarities</option>${RAR.map(r=>`<option ${r===fr?"selected":""}>${r}</option>`).join("")}</select><select id="ft" aria-label="Type"><option value="">All types</option>${types.map(t=>`<option ${t===ft?"selected":""}>${esc(t)}</option>`).join("")}</select>${CAN?'<button class="bt" id="add" style="margin:0">+ Add entry</button>':""}</div>
<div class="grid">${L.length?L.map(card).join(""):'<div class="empty">No entries match. Change filters or add an entry.</div>'}</div></div>`};
R.entry=(id,st)=>{const e=DB.e[id];if(!e)return R.nf();const c=cat(e.cat),fav=FAV.includes(id);
const body=st.edit&&CAN?`<form id="ef"><label>Name</label><input class="fi" name="name" value="${esc(e.name)}" style="width:100%"><label>Rarity</label><select name="rarity">${RAR.map(r=>`<option ${r===e.rarity?"selected":""}>${r}</option>`).join("")}</select><label>Type</label><input class="fi" name="type" value="${esc(e.type)}" style="width:100%"><label>Tags (comma separated)</label><input class="fi" name="tags" value="${esc((e.tags||[]).join(", "))}" style="width:100%"><label>Image URL or path (e.g. img/sword.png)</label><input class="fi" name="img" value="${esc(e.img)}" style="width:100%">${c.f.map(f=>`<label>${f}</label><textarea class="fi" name="f_${f}">${esc(e.f[f]||"")}</textarea>`).join("")}<div class="row"><button class="bt" type="submit">Save</button><button class="bt g" type="button" id="del">Delete</button><button class="bt g" type="button" id="cn">Cancel</button></div></form>`
:`<table>${[["Rarity",bd(e.rarity,e.rarity)],["Type",val(e.type)]].map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join("")}${c.f.map(f=>`<tr><td>${f}</td><td>${val(e.f[f])}</td></tr>`).join("")}</table>`;
return `<div class="wrap"><div class="crumb"><a href="#home">Home</a> / <a href="#c-${c.id}">${c.name}</a> / ${esc(e.name)}</div>
<div class="ent"><div><div class="img">${e.img?`<img src="${e.img}" alt="${esc(e.name)}">`:`<div class="k">${c.k}</div>`}</div></div><div><h1 style="font-size:2.2rem">${esc(e.name)}</h1><div style="margin:10px 0">${(e.tags||[]).map(t=>`<button class="badge" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")}</div>
<div class="row"><button class="bt g" id="fv" style="margin:0">${fav?"★ Favorited":"☆ Add to favorites"}</button>${st.edit||!CAN?"":'<button class="bt g" id="ed" style="margin:0">Edit entry</button>'}</div>${body}</div></div></div>`};
R.favs=()=>`<div class="wrap"><div class="crumb"><a href="#home">Home</a> / Favorites</div><h1>Favorites</h1><div class="grid" style="margin-top:18px">${FAV.filter(i=>DB.e[i]).length?FAV.filter(i=>DB.e[i]).map(i=>card(DB.e[i])).join(""):'<div class="empty">Nothing saved. Open an entry and press “Add to favorites”.</div>'}</div></div>`;
R.changelog=()=>`<div class="wrap"><div class="crumb"><a href="#home">Home</a> / Changelog</div><h1>Changelog</h1>${CAN?'<div class="row"><button class="bt" id="addl" style="margin:0">+ Add update</button></div>':""}${DB.log.map(l=>`<div class="card rv" style="margin-bottom:12px"><h3>${esc(l.v)}</h3><p>${esc(l.d)}</p><p style="color:var(--tx);margin-top:8px">${esc(l.t).replace(/\n/g,"<br>")}</p>${CAN?`<button class="badge" data-dl="${l.id}" style="margin-top:10px">Delete</button>`:""}</div>`).join("")}</div>`;
R.search=st=>{const q=(st.q||"").toLowerCase().replace(/^#/,""),L=find(q,60);return `<div class="wrap"><div class="crumb"><a href="#home">Home</a> / Search</div><h1>Results for “${esc(st.q||"")}”</h1><div class="grid" style="margin-top:18px">${L.length?L.map(card).join(""):'<div class="empty">Nothing found. Try another name, type or tag.</div>'}</div></div>`};
R.nf=()=>!LOADED?`<div class="wrap"><div class="empty">Loading…</div></div>`:`<div class="wrap"><div class="empty">Page not found. <a href="#home" style="color:var(--gold)">Back to Home</a></div></div>`;
function find(q,n){if(!q)return[];return ents().filter(e=>[e.name,e.type,e.rarity,cat(e.cat).name,...(e.tags||[]),...Object.values(e.f)].join(" ").toLowerCase().includes(q)).slice(0,n)}
let st={};
function route(){const h=location.hash.slice(1)||"home";let h2=h;document.body.classList.remove("menu");
if(h!==st.h)st={h};const app=$("#app");let html;
if(h==="home")html=R.home();else if(h.startsWith("c-")&&cat(h.slice(2)))html=R.cat(h.slice(2),st);else if(h.startsWith("e-"))html=R.entry(h,st);else if(R[h]&&h!=="cat"&&h!=="entry")html=R[h](st);else html=R.nf();
if(h.startsWith("e-")&&DB.e[h]){REC=[h,...REC.filter(x=>x!==h)].slice(0,6);sv("s2rec",REC)}
const old=h2;document.title=(h==="home"?"":(DB.e[h]?DB.e[h].name:(cat(h.slice(2))||{}).name||"")+" – ")+"Slayers 2 Wiki";
app.style.animation="none";app.offsetHeight;app.style.animation="";app.innerHTML=html;side(h);if(!st.keep)scrollTo(0,0);st.keep=0;bind();reveal()}
function rerender(){st.keep=1;const y=scrollY;route();scrollTo(0,y)}
function reveal(){const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");io.unobserve(x.target)}}),{threshold:.08});document.querySelectorAll(".rv").forEach((el,i)=>{el.style.transitionDelay=Math.min(i%6,5)*60+"ms";io.observe(el)})}
function bind(){const h=st.h;
document.querySelectorAll("[data-tag]").forEach(b=>b.onclick=()=>{st={h:"search",q:"#"+b.dataset.tag};location.hash="search";route()});
if($("#fr")){$("#fr").onchange=e=>{st.r=e.target.value;rerender()};$("#ft").onchange=e=>{st.t=e.target.value;rerender()};
$("#add").onclick=()=>{const id=uid(),c=h.slice(2);DB.e[id]={id,cat:c,name:"New entry",rarity:"Unknown",type:"Unknown",tags:[],img:"",f:{}};push();st={h:id,edit:1};location.hash=id}}
$("#em").onclick=e=>{e.preventDefault();CAN=!CAN;sv("s2edit",CAN);st.edit=0;rerender()};
if($("#ex"))$("#ex").onclick=async e=>{e.preventDefault();const t="const SEED="+JSON.stringify(DB)+";";try{await navigator.clipboard.writeText(t);alert("Copied. In index.html replace the whole line that starts with const SEED= with the copied text.")}catch(x){const b=new Blob([t],{type:"text/plain"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="seed.js";a.click()}};
if($("#rs"))$("#rs").onclick=e=>{e.preventDefault();if(confirm("Discard local edits and show published data?")){try{localStorage.removeItem("s2db")}catch(x){}DB=JSON.parse(JSON.stringify(SEED));rerender()}};
if($("#fv"))$("#fv").onclick=()=>{FAV=FAV.includes(h)?FAV.filter(x=>x!==h):[h,...FAV];sv("s2fav",FAV);rerender()};
if($("#ed"))$("#ed").onclick=()=>{st.edit=1;rerender()};
if($("#cn"))$("#cn").onclick=()=>{st.edit=0;rerender()};
if($("#del"))$("#del").onclick=()=>{if(confirm("Delete this entry?")){const c=DB.e[h].cat;delete DB.e[h];FAV=FAV.filter(x=>x!==h);REC=REC.filter(x=>x!==h);push();sv("s2fav",FAV);sv("s2rec",REC);location.hash="c-"+c}};
if($("#ef"))$("#ef").onsubmit=ev=>{ev.preventDefault();const d=new FormData(ev.target),e=DB.e[h];e.name=d.get("name")||"Untitled";e.rarity=d.get("rarity");e.type=d.get("type")||"Unknown";e.img=(d.get("img")||"").trim();e.tags=(d.get("tags")||"").split(",").map(s=>s.trim().toLowerCase()).filter(Boolean);cat(e.cat).f.forEach(f=>e.f[f]=d.get("f_"+f)||"");push();st.edit=0;rerender()};
if($("#addl"))$("#addl").onclick=()=>{const v=prompt("Version (e.g. Update name)");if(!v)return;const d=prompt("Date")||"Unknown",t=prompt("What changed?")||"";DB.log.unshift({id:"l"+Date.now(),v,d,t});push();rerender()};
document.querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>{DB.log=DB.log.filter(l=>l.id!==b.dataset.dl);push();rerender()});
if($("#dc"))$("#dc").onclick=e=>{e.preventDefault();if(DISCORD)location.href=DISCORD;else alert("Set your Discord invite in the DISCORD constant at the top of the script.")}}
const q=$("#q"),sg=$("#sug");
q.oninput=()=>{const L=find(q.value.trim().toLowerCase(),6);sg.innerHTML=L.map(e=>`<a href="#${e.id}">${esc(e.name)}<small>${esc(cat(e.cat).name)}</small></a>`).join("");sg.style.display=L.length?"block":"none"};
q.onkeydown=e=>{if(e.key==="Enter"&&q.value.trim()){st={h:"search",q:q.value.trim()};sg.style.display="none";location.hash="search";route()}};
document.addEventListener("click",e=>{if(!e.target.closest(".sw"))sg.style.display="none";if(e.target.closest("#sug a")){sg.style.display="none";q.value=""}});
$("#mb").onclick=()=>document.body.classList.toggle("menu");
const setTh=t=>{document.documentElement.dataset.theme=t;try{localStorage.setItem("s2th",t)}catch(e){}};
setTh((()=>{try{return localStorage.getItem("s2th")}catch(e){return null}})()||"dark");
$("#th").onclick=()=>setTh(document.documentElement.dataset.theme==="dark"?"light":"dark");
$("#top").onclick=()=>scrollTo({top:0});
addEventListener("scroll",()=>{$("#top").classList.toggle("on",scrollY>500);document.querySelectorAll("[data-p]").forEach(el=>el.style.transform=`translateY(${scrollY*el.dataset.p}px)`)},{passive:true});
addEventListener("hashchange",()=>{if(location.hash.slice(1)!==st.h)route()});
route();setTimeout(()=>$("#loader").classList.add("off"),900);
</script></body></html>
